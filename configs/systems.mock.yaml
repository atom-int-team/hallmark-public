# Offline dry-run config — no API key, no network, no cost.
#
# `mock` returns a canned answer for every task, so the whole pipeline
# (generate -> grade -> leaderboard) can be exercised end to end before a real
# system is wired up. The answer below is a syntactically valid selection
# deliverable, so the deterministic id parser accepts it and the selection
# graders score it as an (arbitrary, poor) pick.
systems:
  - id: mock/blind-pick
    adapter: mock
    config:
      default: |
        No reasoning — this is an offline dry-run of the harness.

        Final: c000, c001, c002, c003, c004

# To evaluate a real system, add an entry like the one below (or use
# configs/systems.api-bare.yaml, which holds the twelve systems of the paper).
#
#  - id: myorg/my-model
#    adapter: openai_chat
#    config:
#      model: myorg/my-model
#      api_key_env: MY_API_KEY          # read from .env or the environment
#      base_url: https://api.example.com/v1
#      temperature: 0
#      price_per_1k_in: 0.001           # optional, only for the cost column
#      price_per_1k_out: 0.003
#
# Answers captured by hand from a product UI can be scored instead with the
# `manual` adapter, which reads submissions/<system>/seed<n>/<task_id>.md:
#
#  - id: some-product-ui
#    adapter: manual
