# Harness arm: pi (@earendil-works/pi-coding-agent), an off-the-shelf coding-agent
# scaffold, run over THE SAME OpenRouter slugs as the bare tier in results/final.json.
# The agent gets the task files on disk and a tool loop (bash, file edits) inside a
# Docker sandbox. The control is the same model's bare single-turn run, seed_idx=0;
# the harness arm is run on seed 0 only.
#
# Sandbox: the container sits in the hm-int network (--internal): it has no outbound
# route at all; the only reachable host is the hallmark-gw gateway
# (harness/gateway/nginx.conf.template), which proxies exactly
# https://openrouter.ai/api/v1/. The real key lives in the gateway — the container
# gets a placeholder.
#
# What is PINNED here and why (otherwise the arm is no longer a matched pair):
#   -nc  do not load AGENTS.md/CLAUDE.md — the repository's own instructions describe
#        how the graders work, a direct leak;
#   -ne -ns -np --no-themes -na  do not load user extensions/skills/prompt templates;
#   --no-session  a cell never sees the previous one;
#   --offline     no startup network operations (the network is closed anyway);
#   --thinking  set PER SYSTEM:
#          high for most models. Their bare ledger rows ran on the provider default,
#            so this is a DIVERGENCE from the control — the same for all of them and
#            declared in the paper;
#          kimi-k3 -> medium, because its control row kimi-k3-medium is kimi-k3 with
#            reasoning.effort=medium. Otherwise the kimi delta would mix the scaffold
#            with the reasoning mode — a confound (a parameter override is a separate
#            system).
# pi has no temperature setting at all, while the bare tier ran at temperature: 0.
# Also a declared limitation.
#
# PRICES — the same OpenRouter snapshot as in configs/systems.api-bare.yaml, so the
# cost of the two arms is comparable by construction. They are a fallback: pi reports
# its own cost computation (with a cache breakdown), and that goes into usage.

_pi_command: &pi_command
  - docker
  - run
  - --rm
  - --network=hm-int
  # Resource limits are PART OF THE ARM DEFINITION, not a launch setting. Without them a
  # cell run alone gets all Docker cores, while a cell in a pool of six gets about 1.7;
  # the agent really fits CatBoost and cross-validates, i.e. it is CPU-bound, and the arm
  # would become heterogeneous for a reason the spec does not contain. Keep them the same
  # for single and parallel runs and for every harness.
  - --cpus=2
  - --memory=3g
  - -v
  - "{workspace}:/work"
  - -w
  - /work
  - -e
  - OPENROUTER_API_KEY=sandbox-placeholder
  - hallmark-harness:pi-0.84.3
  - pi
  - -p
  - --mode
  - json
  - --no-session
  - -nc
  - -ne
  - -ns
  - -np
  - --no-themes
  - -na
  - --offline
  - --provider
  - openrouter
  - --model
  - "{model}"
  - --thinking
  - "{thinking}"
  - --
  - "{prompt}"

# Copy of _pi_command; the ONLY difference is the image tag. pi 0.84.3 does not know
# openai/gpt-6-astra (released later) — the entry is added in harness/pi/models.json and
# the image is built under the -cat1 tag. The previous tag is untouched; the catalog of the
# earlier models in the new image is checked by diffing `pi --list-models`.
_pi_command_cat1: &pi_command_cat1
  - docker
  - run
  - --rm
  - --network=hm-int
  - --cpus=2
  - --memory=3g
  - -v
  - "{workspace}:/work"
  - -w
  - /work
  - -e
  - OPENROUTER_API_KEY=sandbox-placeholder
  - hallmark-harness:pi-0.84.3-cat1
  - pi
  - -p
  - --mode
  - json
  - --no-session
  - -nc
  - -ne
  - -ns
  - -np
  - --no-themes
  - -na
  - --offline
  - --provider
  - openrouter
  - --model
  - "{model}"
  - --thinking
  - "{thinking}"
  - --
  - "{prompt}"

# Copy of _pi_command_cat1; the ONLY difference is the image tag: -cat2 = -cat1 + the
# openai/gpt-6.1-sol entry in harness/pi/models.json.
_pi_command_cat2: &pi_command_cat2
  - docker
  - run
  - --rm
  - --network=hm-int
  - --cpus=2
  - --memory=3g
  - -v
  - "{workspace}:/work"
  - -w
  - /work
  - -e
  - OPENROUTER_API_KEY=sandbox-placeholder
  - hallmark-harness:pi-0.84.3-cat2
  - pi
  - -p
  - --mode
  - json
  - --no-session
  - -nc
  - -ne
  - -ns
  - -np
  - --no-themes
  - -na
  - --offline
  - --provider
  - openrouter
  - --model
  - "{model}"
  - --thinking
  - "{thinking}"
  - --
  - "{prompt}"

systems:
  - id: pi/anthropic-claude-opus-5
    adapter: cli_agent
    config:
      harness: pi
      harness_version: 0.84.3
      model: anthropic/claude-opus-5
      thinking: high
      command: *pi_command
      # The watchdog is part of the arm definition: a per-attempt wall-clock limit.
      # It exists to catch a HUNG cell; 7200 s rather than 3600 s because opus with
      # `--thinking high` genuinely computes for an hour at 100% CPU, and a 3600 s
      # limit cut working cells, not hung ones.
      timeout: 7200
      # An exhausted watchdog is scored as ZERO, not as missing: the limit is declared
      # part of the arm, i.e. a compute budget given to the system, and "never finished"
      # is its behaviour, like the output-token cap in the bare tier. A gateway failure
      # still leaves the cell missing.
      timeout_exhausted_scores_zero: true
      price_per_1k_in: 0.005
      price_per_1k_out: 0.025

  - id: pi/x-ai-grok-4.6
    adapter: cli_agent
    config:
      harness: pi
      harness_version: 0.84.3
      model: x-ai/grok-4.6
      thinking: high
      command: *pi_command
      # Per-ATTEMPT watchdog: in a parallel pool a hung cell would hold its slot forever.
      # A timeout is a transport fault in the adapter's sense: retry, not a cached zero.
      # The same 7200 s for every model, so the arm has one definition.
      timeout: 7200
      timeout_exhausted_scores_zero: true
      price_per_1k_in: 0.002
      price_per_1k_out: 0.006

  # The slug is PINNED to `-preview`, exactly like the ledger row: for google these are
  # different builds, and a floating slug would split the pair.
  # `--thinking high` is the same divergence from the ledger as for the other models
  # (there: the provider default, for gemini a dynamic budget), declared in the paper.
  - id: pi/google-gemini-3.1-pro-preview
    adapter: cli_agent
    config:
      harness: pi
      harness_version: 0.84.3
      model: google/gemini-3.1-pro-preview
      thinking: high
      command: *pi_command
      timeout: 7200
      timeout_exhausted_scores_zero: true
      price_per_1k_in: 0.002
      price_per_1k_out: 0.012

  # The control row in the ledger is named moonshotai/kimi-k3-medium, but it is the
  # moonshotai/kimi-k3 slug with reasoning.effort=medium. Here the mode is set by the
  # --thinking flag, not extra_body.
  - id: pi/moonshotai-kimi-k3
    adapter: cli_agent
    config:
      harness: pi
      harness_version: 0.84.3
      model: moonshotai/kimi-k3
      thinking: medium
      command: *pi_command
      # The watchdog is the system's COMPUTE BUDGET, not a launch setting: the same
      # 7200 s for every model. All attempts exhausted -> the cell scores zero (system
      # behaviour), not missing; missing is reserved for gateway failures.
      timeout: 7200
      timeout_exhausted_scores_zero: true
      price_per_1k_in: 0.003
      price_per_1k_out: 0.015

  # Control: the ledger row openai/gpt-5.6-sol, seed 0 (run on the provider's default
  # reasoning). `--thinking high` is the same declared divergence as for opus-5 /
  # grok-4.6 / gemini-3.1: one for all arms except kimi, whose control ran on medium.
  - id: pi/openai-gpt-5.6-sol
    adapter: cli_agent
    config:
      harness: pi
      harness_version: 0.84.3
      model: openai/gpt-5.6-sol
      thinking: high
      command: *pi_command
      # The watchdog is the system's compute budget, the same 7200 s as for the others.
      timeout: 7200
      timeout_exhausted_scores_zero: true
      # Price: the same OpenRouter snapshot as the ledger row (systems.api-bare.yaml).
      price_per_1k_in: 0.005
      price_per_1k_out: 0.03

  # The model is missing from pi 0.84.3's built-in catalog — added in
  # harness/pi/models.json, image pi-0.84.3-cat1. Control: bare openai/gpt-6-astra
  # seed 0, run on the current prompts. --thinking high is the same declared
  # divergence from the bare default as for opus/grok/gemini/sol.
  - id: pi/openai-gpt-6-astra
    adapter: cli_agent
    config:
      harness: pi
      harness_version: 0.84.3-cat1
      model: openai/gpt-6-astra
      thinking: high
      command: *pi_command_cat1
      timeout: 7200
      timeout_exhausted_scores_zero: true
      price_per_1k_in: 0.010
      price_per_1k_out: 0.050

  # The model is missing from pi 0.84.3's built-in catalog — added in
  # harness/pi/models.json, image pi-0.84.3-cat2 (= cat1 + one entry, catalog checked by
  # diff). Control: bare openai/gpt-6.1-sol seed 0, run on the current prompts.
  # --thinking high is the same declared divergence from the bare default.
  - id: pi/openai-gpt-6.1-sol
    adapter: cli_agent
    config:
      harness: pi
      harness_version: 0.84.3-cat2
      model: openai/gpt-6.1-sol
      thinking: high
      command: *pi_command_cat2
      timeout: 7200
      timeout_exhausted_scores_zero: true
      price_per_1k_in: 0.002
      price_per_1k_out: 0.010
