# Second harness of the harness axis: opencode (opencode-ai 1.18.29), an off-the-shelf
# coding-agent scaffold, run over THE SAME OpenRouter slugs as pi (configs/systems.pi.yaml)
# and the bare tier (results/final.json). Like the pi arm, it runs in a Docker sandbox whose
# network reaches only the model gateway, on seed 0 only, and is compared with the same
# model's bare single-turn run.
#
# BUILD:  docker build --build-arg OPENCODE_VERSION=1.18.29 \
#             -t hallmark-harness:opencode-1.18.29-cfg2 harness/opencode
# Arm version cfg2: external_directory=allow + continue_loop_on_deny — see
# harness/opencode/opencode.json.
#
# IDENTICAL to pi by construction (otherwise the arms are not comparable): the hm-int
# network and gateway, limits --cpus=2 --memory=3g, the scientific stack (requirements.lock
# is a copy), the 7200 s watchdog as a compute budget (exhausted -> 0), prompt preamble v1,
# models and prices.
# DIFFERENT and declared: subagents are allowed, the title call uses the same model,
# automatic context compaction, the bash-command timeout is chosen by the model itself,
# and opencode retries the LLM itself for ~60 s before giving up (pi does not).
# `{thinking}` here = `--variant` (provider-specific reasoning effort): high for all,
# the same declared divergence from the bare default as for pi.

_opencode_command: &opencode_command
  - docker
  - run
  - --rm
  - --network=hm-int
  - --cpus=2
  - --memory=3g
  - -v
  - "{workspace}:/work"
  - -w
  - /work
  - hallmark-harness:opencode-1.18.29-cfg2
  # ENTRYPOINT = hallmark-opencode <model> <variant> <prompt>
  - "{model}"
  - "{thinking}"
  - "{prompt}"

systems:
  # Grok 4.6 was the first opencode configuration: 90 of its 92 cells ran on the image before
  # cfg2 (harness_version 1.18.29, opencode defaults for external_directory and
  # continue_loop_on_deny); the two cells that hit the headless denial were re-run on cfg2.
  # Each transcript records its own harness_version.
  - id: opencode/x-ai-grok-4.6
    adapter: cli_agent
    config:
      harness: opencode
      harness_version: "1.18.29-cfg2"
      parser: opencode
      model: x-ai/grok-4.6
      thinking: high
      command: *opencode_command
      timeout: 7200
      timeout_exhausted_scores_zero: true
      price_per_1k_in: 0.002
      price_per_1k_out: 0.006

  # The slug is pinned to -preview, like the ledger row and the pi arm.
  # Control: the same model's bare seed-0 row, paired as in scripts/harness_paired_delta.py.
  - id: opencode/google-gemini-3.1-pro-preview
    adapter: cli_agent
    config:
      harness: opencode
      harness_version: "1.18.29-cfg2"
      parser: opencode
      model: google/gemini-3.1-pro-preview
      thinking: high
      command: *opencode_command
      timeout: 7200
      timeout_exhausted_scores_zero: true
      price_per_1k_in: 0.002
      price_per_1k_out: 0.012

  - id: opencode/openai-gpt-5.6-sol
    adapter: cli_agent
    config:
      harness: opencode
      harness_version: "1.18.29-cfg2"
      parser: opencode
      model: openai/gpt-5.6-sol
      thinking: high
      command: *opencode_command
      timeout: 7200
      timeout_exhausted_scores_zero: true
      price_per_1k_in: 0.005
      price_per_1k_out: 0.03

  # The model is in the models.dev catalog bundled with 1.18.29 (variants low..max), so
  # --variant high resolves normally; catalog prices equal OpenRouter's, so the self-reported
  # cost does not drift here (unlike Sol), except for subagents. cfg2, like gemini/sol.
  - id: opencode/openai-gpt-6-astra
    adapter: cli_agent
    config:
      harness: opencode
      harness_version: "1.18.29-cfg2"
      parser: opencode
      model: openai/gpt-6-astra
      thinking: high
      command: *opencode_command
      timeout: 7200
      timeout_exhausted_scores_zero: true
      price_per_1k_in: 0.010
      price_per_1k_out: 0.050
