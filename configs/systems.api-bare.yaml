# The fourteen systems evaluated in the paper — bare API configurations, all reached
# through one OpenAI-compatible endpoint (OpenRouter).
#
# The protocol is identical for every entry: a single turn, temperature 0, no tools,
# no retrieval, no code execution, and no per-model tuning of maximum tokens or top-p.
# The system sees the task text with its CSV attachments inlined in full and returns
# one response, whose `Final:` line is the only thing scored.
#
# Two entries pin `reasoning.effort` instead of taking the provider default, and both
# are disclosed in the paper for the same reason: at the vendor default the model
# exhausts its reasoning budget before producing a deliverable. Reasoning effort is a
# model-behaviour parameter, so each such configuration is reported as its OWN system
# and is never mixed cell-wise with a default-configuration run.
#   - moonshotai/kimi-k3-medium  — effort "medium"
#   - qwen/qwen3.8-max-high      — effort "high" (the model's default is "xhigh")
#
# `request_timeout` / `max_retries`, where present, are TRANSPORT settings, not model
# behaviour: the adapter default of 300 s severs live generations on the slowest models
# and turns them into forced zeros.
#
# PRICES (`price_per_1k_in` / `price_per_1k_out`, USD per 1000 tokens) are OpenRouter
# list prices captured between 2026-07-21 and 2026-10-16, on the date each system was
# run. OpenRouter quotes per token; these are x1000. No long-context tier applies to
# this slate — the largest cell measures ~207k prompt tokens on the most verbose
# tokenizer and no priced threshold was crossed. Prices drift; re-snapshot before
# quoting them.
#
# Setup: put OPENROUTER_API_KEY in .env (or the environment). Model slugs behind these
# ids are moving snapshots on the provider side, so a rerun is not guaranteed to
# reproduce the published numbers exactly.
systems:
  - id: google/gemini-3.1-pro-preview
    adapter: openai_chat
    config: { model: google/gemini-3.1-pro-preview, api_key_env: OPENROUTER_API_KEY, base_url: https://openrouter.ai/api/v1, temperature: 0, capabilities: { manual: true }, price_per_1k_in: 0.002, price_per_1k_out: 0.012 }

  - id: anthropic/claude-opus-5
    adapter: openai_chat
    config: { model: anthropic/claude-opus-5, api_key_env: OPENROUTER_API_KEY, base_url: https://openrouter.ai/api/v1, temperature: 0, capabilities: { manual: true }, price_per_1k_in: 0.005, price_per_1k_out: 0.025 }

