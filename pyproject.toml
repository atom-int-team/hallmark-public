[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hallmark"
version = "1.0.0"
description = "Hallmark: a benchmark scoring AI materials decisions by regret against known optima."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hallmark authors" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "openai>=1.40",
]

[project.optional-dependencies]
# Reproduce the two published baselines (Appendix "Baselines"): the shortcut audit and
# the tabular ML baseline. Not needed to run or grade the benchmark.
baselines = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3", "catboost>=1.2", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
hallmark = "hallmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hallmark"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: (str, Enum) is intentional for pydantic/YAML value compatibility.
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Adapter/grader __init__ files import submodules for their registration side effect.
"hallmark/adapters/__init__.py" = ["F401"]
"hallmark/graders/__init__.py" = ["F401"]
# Published analysis code is shipped as it was run; style is not retrofitted onto it.
"scripts/*.py" = ["B007", "B905", "E401", "E701", "E702"]
"analysis/**/*.py" = ["B023", "B905", "UP033"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
